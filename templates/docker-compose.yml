services:
  gateway:
    image: nginx:alpine
    container_name: local_ssl_gateway
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - web
      - backend
    restart: unless-stopped

  web:
    build: .
    expose:
      - "3000"

  backend:
    build: ./backend
    expose:
      - "8000"
